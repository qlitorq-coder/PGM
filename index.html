<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Облачная ИИ-CRM</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        
        <!-- ЭКРАН ЛОГИНА -->
        <div id="loginSection" class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-md mt-20">
            <h2 class="text-2xl font-bold mb-4 text-center">Вход в CRM</h2>
            <div class="space-y-4">
                <input type="text" id="loginUser" placeholder="Имя пользователя" class="w-full border p-2 rounded">
                <input type="password" id="loginPass" placeholder="Пароль" class="w-full border p-2 rounded">
                <button onclick="handleLogin()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Войти</button>
            </div>
        </div>

        <!-- ОСНОВНОЙ ЭКРАН СИСТЕМЫ (скрыт по умолчанию) -->
        <div id="mainSection" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800">📊 Корпоративная CRM</h1>
                <div class="text-right">
                    <span id="userInfo" class="font-semibold text-gray-600 mr-4"></span>
                    <a href="/logout" class="text-red-500 underline text-sm">Выйти</a>
                </div>
            </div>

            <!-- ПАНЕЛЬ АДМИНИСТРАТОРА (Добавление сотрудников) -->
            <div id="adminPanel" class="hidden bg-purple-50 border border-purple-200 p-4 rounded-lg mb-6">
                <h3 class="font-bold text-purple-900 mb-2">💼 Панель директора: Создать аккаунт сотруднику</h3>
                <div class="flex flex-wrap gap-2">
                    <input type="text" id="newUsername" placeholder="Имя нового менеджера" class="border p-2 bg-white rounded text-sm">
                    <input type="password" id="newPassword" placeholder="Пароль для него" class="border p-2 bg-white rounded text-sm">
                    <button onclick="createEmployee()" class="bg-purple-700 text-white px-4 py-2 rounded text-sm hover:bg-purple-800">Зарегистрировать</button>
                </div>
            </div>

            <!-- ФОРМА ДОБАВЛЕНИЯ КЛИЕНТА -->
            <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Внести нового клиента</h2>
                <form id="clientForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="name" placeholder="ФИО / Название компании" required class="border p-2 rounded w-full">
                    <input type="text" id="phone" placeholder="Телефон" class="border p-2 rounded w-full">
                    <input type="email" id="email" placeholder="Email" class="border p-2 rounded w-full">
                    <select id="status" class="border p-2 rounded w-full">
                        <option value="Новый">Новый</option>
                        <option value="В переговорах">В переговорах</option>
                        <option value="Выставлен счет">Выставлен счет</option>
                        <option value="Оплачено">Оплачено</option>
                    </select>
                    <input type="text" id="comment" placeholder="Примечание к клиенту" class="border p-2 rounded w-full md:col-span-2">
                    <button type="submit" class="md:col-span-3 bg-blue-600 text-white p-2 rounded hover:bg-blue-700 transition">Добавить в базу</button>
                </form>
            </div>

            <!-- ТАБЛИЦА -->
            <div class="bg-white rounded-lg shadow-md overflow-x-auto">
                <table class="min-w-full leading-normal">
                    <thead>
                        <tr class="bg-gray-200 text-gray-600 text-left text-xs uppercase font-normal">
                            <th class="px-5 py-3 border-b-2">ID</th>
                            <th class="px-5 py-3 border-b-2">Клиент</th>
                            <th class="px-5 py-3 border-b-2">Контакты</th>
                            <th class="px-5 py-3 border-b-2">Статус</th>
                            <th class="px-5 py-3 border-b-2">Менеджер (Ответственный)</th>
                            <th class="px-5 py-3 border-b-2">Комментарий</th>
                        </tr>
                    </thead>
                    <tbody id="clientsTable" class="text-gray-700 text-sm"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        let currentUser = null;

        async function handleLogin() {
            const username = document.getElementById('loginUser').value;
            const password = document.getElementById('loginPass').value;
            
            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            
            if(res.ok) {
                const data = await res.json();
                initApp(username, data.role);
            } else {
                alert('Ошибка авторизации!');
            }
        }

        function initApp(username, role) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('userInfo').innerText = `${username} (${role === 'admin' ? 'Директор' : 'Менеджер'})`;
            
            if(role === 'admin') {
                document.getElementById('adminPanel').classList.remove('hidden');
            }
            loadClients();
        }

        async function createEmployee() {
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;
            const res = await fetch('/api/users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            });
            if(res.ok) {
                alert('Сотрудник успешно создан!');
                document.getElementById('newUsername').value = '';
                document.getElementById('newPassword').value = '';
            } else {
                alert('Ошибка при создании');
            }
        }

        async function loadClients() {
            const res = await fetch('/api/clients');
            if (!res.ok) return;
            const clients = await res.json();
            const tbody = document.getElementById('clientsTable');
            tbody.innerHTML = '';
            
            clients.forEach(c => {
                tbody.innerHTML += `
                    <tr class="border-b hover:bg-gray-50">
                        <td class="px-5 py-4">${c.id}</td>
                        <td class="px-5 py-4 font-semibold text-gray-900">${c.name}</td>
                        <td class="px-5 py-4">${c.phone || ''}<br><span class="text-gray-400 text-xs">${c.email || ''}</span></td>
                        <td class="px-5 py-4"><span class="px-2 py-1 text-xs rounded font-bold bg-blue-100 text-blue-800">${c.status}</span></td>
                        <td class="px-5 py-4 text-purple-700 font-medium">👤 ${c.manager}</td>
                        <td class="px-5 py-4 text-gray-500">${c.comment || ''}</td>
                    </tr>
                `;
            });
        }

        document.getElementById('clientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                status: document.getElementById('status').value,
                comment: document.getElementById('comment').value
            };
            await fetch('/api/clients', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            document.getElementById('clientForm').reset();
            loadClients();
        });
    </script>
</body>
</html>
